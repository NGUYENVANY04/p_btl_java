<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Dashboard Management - Dark Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b1426; /* Màu nền cực tối */
            color: #e2e8f0;
            overflow: hidden;
        }

        /* Sidebar tối màu */
        .sidebar {
            width: 300px;
            background-color: #0f172a; /* Màu Navy đậm */
            height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: fixed;
            left: 0;
            top: 0;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 10;
        }

        /* Nút bấm hiệu ứng Gradient Dark */
        .nav-button {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: #94a3b8; /* Chữ xám nhạt */
            font-weight: 600;
            padding: 15px 20px;
            text-align: left;
            width: 100%;
            min-height: 80px;
            display: flex;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            line-height: 1.4;
            font-size: 0.875rem;
            position: relative;
            overflow: hidden;
        }

        /* Hiệu ứng khi Hover */
        .nav-button:hover {
            color: #f8fafc;
            background: linear-gradient(135deg, #334155 0%, #1e293b 100%);
            border-color: #38bdf8; /* Viền xanh sáng */
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
            transform: translateX(5px);
        }

        /* Trạng thái nút đang được chọn (Active) */
        .nav-button.active {
            background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
            color: white;
            border-color: transparent;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
        }

        /* Vùng nội dung chính */
        .main-content {
            margin-left: 300px;
            width: calc(100% - 300px);
            height: 100vh;
            background-color: #0b1426;
            padding: 20px;
        }

        /* Bo góc khung hiển thị */
        #content-frame {
            width: 100%;
            height: 100%;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background-color: #162641; /* Màu nền iframe */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Tên ứng dụng trên Sidebar */
        .logo {
            font-size: 1.25rem;
            font-bold: 700;
            margin-bottom: 20px;
            padding-left: 10px;
            color: white;
            letter-spacing: 1px;
        }
        
        .logo span { color: #38bdf8; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">FUSION<span>SMART</span></div>
        
        <button class="nav-button" onclick="changePage('usercase1/usercase1.html', this)">
            Thêm xóa và gắn ngưỡng thiết bị
        </button>

        <button class="nav-button" onclick="changePage('usercase2/usercase2.html', this)">
            usercase2 
        </button>

        <button class="nav-button active" onclick="changePage('usercase3/usercase3.html', this)">
            Theo dõi dữ liệu thiết bị
        </button>

        <button class="nav-button" onclick="changePage('usercase4/usercase4.html', this)">
            Thông báo hệ thống & Logs
        </button>

        <button class="nav-button" onclick="changePage('usercase5/usercase5.html', this)">
            Quản trị tài khoản & Firmware
        </button>
    </div>

    <div class="main-content">
        <iframe id="content-frame" src="usercase3/usercase3.html"></iframe>
    </div>

    <script>
        function changePage(url, btn) {
            // Đổi nguồn iframe
            document.getElementById('content-frame').src = url;

            // Đổi trạng thái Active cho nút
            const buttons = document.querySelectorAll('.nav-button');
            buttons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>

</body>
</html>
