<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Alerts Dashboard - User Case 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        .hidden {
            display: none;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th,
        td {
            text-align: left;
            padding: 8px;
        }

        th {
            background-color: rgba(255, 255, 255, 0.1);
        }

        tr:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.02);
        }
    </style>
</head>

<body class="text-white">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="glass rounded-xl p-6 mb-8">
            <div class="flex justify-between items-center mb-4">
                <div class="text-right">
                    <div id="clock-time" class="text-2xl font-mono"></div>
                    <div id="clock-date" class="text-sm text-slate-400"></div>
                </div>
            </div>

            <!-- Status -->
            <div class="flex items-center mb-4">
                <div id="status-dot" class="status-dot"></div>
                <span id="status-text" class="text-lg">Sẵn sàng</span>
            </div>

            <!-- Controls -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium mb-2">API Base URL</label>
                    <input id="api-base" type="text" value="http://localhost:8080"
                        class="w-full px-3 py-2 bg-slate-800 border border-slate-600 rounded-lg focus:ring-2 focus:ring-cyan-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Offline Seconds</label>
                    <input id="offline-seconds" type="number" value="4" min="1" max="300"
                        class="w-full px-3 py-2 bg-slate-800 border border-slate-600 rounded-lg focus:ring-2 focus:ring-cyan-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Alerts Limit</label>
                    <input id="alerts-limit" type="number" value="50" min="1" max="200"
                        class="w-full px-3 py-2 bg-slate-800 border border-slate-600 rounded-lg focus:ring-2 focus:ring-cyan-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Auto Refresh (seconds)</label>
                    <input id="refresh-seconds" type="number" value="30" min="0" max="300"
                        class="w-full px-3 py-2 bg-slate-800 border border-slate-600 rounded-lg focus:ring-2 focus:ring-cyan-500">
                </div>
            </div>

            <!-- Buttons -->
            <div class="flex gap-4">
                <button id="btn-check-now"
                    class="px-6 py-2 bg-cyan-600 hover:bg-cyan-700 rounded-lg font-medium transition-colors">
                    Check Now
                </button>
                <button id="btn-refresh-alerts"
                    class="px-6 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg font-medium transition-colors">
                    Refresh Alerts
                </button>
                <button id="btn-toggle-auto"
                    class="px-6 py-2 bg-green-600 hover:bg-green-700 rounded-lg font-medium transition-colors">
                    Auto: ON
                </button>
            </div>
        </div>

        <!-- Error Box -->
        <div id="error-box" class="glass rounded-xl p-4 mb-8 hidden">
            <div class="flex items-center">
                <div class="text-red-400 mr-3">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd"
                            d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
                            clip-rule="evenodd"></path>
                    </svg>
                </div>
                <div id="error-text" class="text-red-300"></div>
            </div>
        </div>

        <!-- Offline Devices Section -->
        <div class="glass rounded-xl p-6 mb-8">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold text-red-400">Thiết Bị Offline</h2>
                <span class="text-sm text-slate-400">Count: <span id="offline-count">0</span></span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr>
                            <th class="px-4 py-3 text-left">Device ID</th>
                            <th class="px-4 py-3 text-left">Last Seen</th>
                            <th class="px-4 py-3 text-left">Minutes Offline</th>
                        </tr>
                    </thead>
                    <tbody id="offline-tbody">
                        <tr>
                            <td colspan="3" class="px-4 py-4 text-slate-500 text-center">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Over Limit Devices Section -->
        <div class="glass rounded-xl p-6 mb-8">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold text-amber-400">Thiết Bị Vượt Ngưỡng</h2>
                <span class="text-sm text-slate-400">Count: <span id="over-count">0</span></span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr>
                            <th class="px-4 py-3 text-left">Device ID</th>
                            <th class="px-4 py-3 text-left">Power (W)</th>
                            <th class="px-4 py-3 text-left">Max Power</th>
                            <th class="px-4 py-3 text-left">Current (A)</th>
                            <th class="px-4 py-3 text-left">Max Current</th>
                        </tr>
                    </thead>
                    <tbody id="over-tbody">
                        <tr>
                            <td colspan="5" class="px-4 py-4 text-slate-500 text-center">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Alerts Section -->
        <div class="glass rounded-xl p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold text-blue-400">Danh Sách Alerts</h2>
                <span class="text-sm text-slate-400">Count: <span id="alerts-count">0</span></span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr>
                            <th class="px-4 py-3 text-left">ID</th>
                            <th class="px-4 py-3 text-left">Device ID</th>
                            <th class="px-4 py-3 text-left">Type</th>
                            <th class="px-4 py-3 text-left">Message</th>
                            <th class="px-4 py-3 text-left">Read</th>
                        </tr>
                    </thead>
                    <tbody id="alerts-tbody">
                        <tr>
                            <td colspan="5" class="px-4 py-4 text-slate-500 text-center">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="usercase2.js"></script>
</body>

</html>
