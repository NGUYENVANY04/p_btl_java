<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Usercase 2 - Offline & Alert ngưỡng</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-6 bg-slate-50 text-slate-800">
  <div class="flex items-start justify-between gap-4 mb-6">
    <div>
      <h2 class="text-xl font-bold">Task 3, 4 - Offline & Cảnh báo vượt ngưỡng</h2>
      <p class="text-sm text-slate-500">Gọi API backend Spring Boot tại <span class="font-mono">/api/daocuong/*</span></p>
    </div>
    <div class="text-right">
      <div class="text-xs text-slate-500">Backend</div>
      <div class="font-mono text-sm" id="baseUrlLabel"></div>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <!-- Task 3 -->
    <div class="bg-white p-6 rounded-xl shadow-sm border">
      <div class="flex items-center justify-between gap-4 mb-4">
        <h3 class="font-semibold text-blue-700">Task 3: Phát hiện thiết bị offline</h3>
        <button class="px-3 py-2 rounded-lg border hover:bg-slate-50" id="btnRefreshStatus">Tải device_status</button>
      </div>

      <div class="flex gap-3 items-end mb-4">
        <div class="flex-1">
          <label class="block text-sm text-slate-500">Ngưỡng offline (phút)</label>
          <input id="offlineMinutes" type="number" value="5" min="1"
                 class="w-full border rounded p-2 mt-1 outline-none focus:ring-2 focus:ring-blue-400"/>
        </div>
        <button id="btnCheckOffline"
                class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 transition">
          Kiểm tra offline
        </button>
      </div>

      <div class="text-sm text-slate-600 mb-3" id="offlineResultMeta"></div>

      <div class="overflow-auto border rounded-lg">
        <table class="min-w-full text-sm">
          <thead class="bg-slate-100 text-slate-700">
            <tr>
              <th class="text-left px-3 py-2">device_id</th>
              <th class="text-left px-3 py-2">is_online</th>
              <th class="text-left px-3 py-2">last_seen</th>
            </tr>
          </thead>
          <tbody id="statusTable" class="divide-y"></tbody>
        </table>
      </div>
    </div>

    <!-- Task 4 -->
    <div class="bg-white p-6 rounded-xl shadow-sm border">
      <div class="flex items-center justify-between gap-4 mb-4">
        <h3 class="font-semibold text-orange-700">Task 4: Cảnh báo vượt ngưỡng</h3>
        <button class="px-3 py-2 rounded-lg border hover:bg-slate-50" id="btnRefreshAlerts">Tải alerts</button>
      </div>

      <div class="flex gap-3 items-end mb-4">
        <div class="flex-1">
          <label class="block text-sm text-slate-500">Device ID</label>
          <input id="deviceId" type="number" placeholder="Ví dụ: 1"
                 class="w-full border rounded p-2 mt-1 outline-none focus:ring-2 focus:ring-orange-400"/>
        </div>
        <button id="btnCheckThreshold"
                class="px-4 py-2 rounded-lg bg-orange-500 text-white hover:bg-orange-600 transition">
          Check ngưỡng
        </button>
      </div>

      <div id="thresholdResult" class="text-sm text-slate-700 mb-3"></div>

      <div class="flex items-center justify-between mb-2">
        <div class="text-sm font-medium">Alerts gần đây</div>
        <div class="text-xs text-slate-500">Mặc định lấy 20 bản ghi</div>
      </div>
      <div class="overflow-auto border rounded-lg">
        <table class="min-w-full text-sm">
          <thead class="bg-slate-100 text-slate-700">
            <tr>
              <th class="text-left px-3 py-2">id</th>
              <th class="text-left px-3 py-2">device_id</th>
              <th class="text-left px-3 py-2">type</th>
              <th class="text-left px-3 py-2">message</th>
              <th class="text-left px-3 py-2">is_read</th>
            </tr>
          </thead>
          <tbody id="alertsTable" class="divide-y"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const BASE_URL = `${location.protocol}//${location.hostname}:${location.port || 8081}`;
    document.getElementById('baseUrlLabel').textContent = BASE_URL;

    async function api(path, options = {}) {
      const res = await fetch(`${BASE_URL}${path}`, {
        headers: { 'Content-Type': 'application/json' },
        ...options
      });
      if (!res.ok) {
        const txt = await res.text().catch(() => '');
        throw new Error(`HTTP ${res.status}: ${txt}`);
      }
      return res.json();
    }

    function fmt(v) {
      if (v === null || v === undefined) return '';
      return String(v);
    }

    function badgeOnline(isOnline) {
      const yes = isOnline === true || String(isOnline).toLowerCase() === 'true';
      const cls = yes ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800';
      const label = yes ? 'ONLINE' : 'OFFLINE';
      return `<span class="px-2 py-1 rounded-full text-xs font-semibold ${cls}">${label}</span>`;
    }

    async function loadStatuses() {
      const data = await api('/api/daocuong/device-statuses');
      const tbody = document.getElementById('statusTable');
      tbody.innerHTML = data.map(row => `
        <tr class="hover:bg-slate-50">
          <td class="px-3 py-2 font-mono">${fmt(row.device_id)}</td>
          <td class="px-3 py-2">${badgeOnline(row.is_online)}</td>
          <td class="px-3 py-2 font-mono text-xs">${fmt(row.last_seen)}</td>
        </tr>
      `).join('');
    }

    async function checkOffline() {
      const minutes = parseInt(document.getElementById('offlineMinutes').value || '5', 10);
      const result = await api(`/api/daocuong/check-offline?minutes=${encodeURIComponent(minutes)}`, { method: 'POST' });
      document.getElementById('offlineResultMeta').innerHTML = `
        <div><span class="font-semibold">checked_at:</span> <span class="font-mono text-xs">${fmt(result.checked_at)}</span></div>
        <div class="mt-1">
          <span class="font-semibold">updated_status_rows:</span> ${fmt(result.updated_status_rows)}
          <span class="mx-2">·</span>
          <span class="font-semibold">alerts_created:</span> ${fmt(result.alerts_created)}
          <span class="mx-2">·</span>
          <span class="font-semibold">offline_devices:</span> ${Array.isArray(result.offline_devices) ? result.offline_devices.length : 0}
        </div>
      `;
      await loadStatuses();
      await loadAlerts();
    }

    async function loadAlerts() {
      const data = await api('/api/daocuong/alerts?limit=20');
      const tbody = document.getElementById('alertsTable');
      tbody.innerHTML = data.map(row => `
        <tr class="hover:bg-slate-50">
          <td class="px-3 py-2 font-mono text-xs">${fmt(row.id)}</td>
          <td class="px-3 py-2 font-mono">${fmt(row.device_id)}</td>
          <td class="px-3 py-2 font-mono text-xs">${fmt(row.type)}</td>
          <td class="px-3 py-2">${fmt(row.message)}</td>
          <td class="px-3 py-2">${row.is_read ? 'true' : 'false'}</td>
        </tr>
      `).join('');
    }

    async function checkThreshold() {
      const deviceId = parseInt(document.getElementById('deviceId').value || '', 10);
      if (!deviceId) {
        document.getElementById('thresholdResult').innerHTML =
          `<span class="text-rose-700 font-semibold">Vui lòng nhập deviceId</span>`;
        return;
      }
      const result = await api(`/api/daocuong/check-threshold?deviceId=${encodeURIComponent(deviceId)}`, { method: 'POST' });

      const exceeded = !!result.exceeded;
      const cls = exceeded ? 'text-rose-700' : 'text-emerald-700';
      document.getElementById('thresholdResult').innerHTML = `
        <div class="${cls} font-semibold">Kết quả: ${exceeded ? 'VƯỢT NGƯỠNG' : 'OK'}</div>
        <div class="mt-1 text-xs text-slate-600 font-mono whitespace-pre-wrap">${JSON.stringify(result, null, 2)}</div>
      `;
      await loadAlerts();
    }

    document.getElementById('btnRefreshStatus').addEventListener('click', () => loadStatuses().catch(alert));
    document.getElementById('btnCheckOffline').addEventListener('click', () => checkOffline().catch(alert));
    document.getElementById('btnRefreshAlerts').addEventListener('click', () => loadAlerts().catch(alert));
    document.getElementById('btnCheckThreshold').addEventListener('click', () => checkThreshold().catch(alert));

    // initial load
    loadStatuses().catch(() => {});
    loadAlerts().catch(() => {});
  </script>
</body>
</html>
