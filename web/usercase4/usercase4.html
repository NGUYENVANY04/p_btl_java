<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Giám sát & Điều khiển Năng lượng</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* ===== RESET & GLOBAL ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0b1c2c;
            color: #e6f1ff;
        }

        /* ===== LAYOUT ===== */
        .wrapper {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            padding: 20px;
        }

        /* ===== CARD STYLE ===== */
        .card {
            background: #0f2235;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.05);
            margin-bottom: 20px;
        }

        .title {
            font-size: 18px;
            margin-bottom: 15px;
            color: #00e5ff;
            font-weight: bold;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            padding-bottom: 10px;
        }

        /* ===== FORM ELEMENTS ===== */
        label {
            display: block;
            margin-top: 10px;
            font-size: 13px;
            color: #9bb3c9;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            border: none;
            background: #08131f;
            color: white;
            font-size: 14px;
        }

        /* ===== BUTTONS ===== */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-primary {
            background: #00e5ff;
            color: #000;
        }

        .btn-on {
            background: #2ecc71;
            color: #fff;
        }

        .btn-off {
            background: #e74c3c;
            color: #fff;
        }

        button:hover {
            opacity: 0.8;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        /* ===== STATUS DISPLAYS ===== */
        .status-box {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            background: #08131f;
            text-align: center;
            font-size: 13px;
        }

        /* ===== TABLE ===== */
        .table-wrapper {
            max-height: 600px;
            overflow-y: auto;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            position: sticky;
            top: 0;
            background: #162d42;
            z-index: 10;
        }

        th,
        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid rgba(0, 255, 255, 0.05);
        }

        th {
            color: #00e5ff;
            font-size: 12px;
        }

        .badge {
            background: #00e5ff;
            color: black;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: bold;
        }

        /* Realtime Highlight Animation */
        .new-row {
            animation: flash 2s ease-out;
        }

        @keyframes flash {
            0% {
                background: rgba(0, 255, 255, 0.2);
            }

            100% {
                background: transparent;
            }
        }
    </style>
</head>

<body>

    <div class="wrapper">
        <div class="sidebar">
            <div class="card">
                <div class="title">⚙️ Cấu hình hệ thống</div>
                <label>Địa chỉ API Backend</label>
                <input id="api" value="http://localhost:8080">

                <label>Số dòng hiển thị</label>
                <input id="limit" value="50" type="number">

                <button class="btn-primary" style="width: 100%; margin-top: 15px;" onclick="manualCheck()">⚡ Kiểm tra
                    kết nối</button>
                <div class="status-box" id="status">🔄 Đang khởi tạo...</div>
            </div>

            <div class="card">
                <div class="title">🔌 Điều khiển thiết bị</div>
                <div style="margin-bottom: 10px; font-size: 14px;">Trạng thái thiết bị 1:</div>
                <div class="btn-group">
                    <button class="btn-on" onclick="controlDevice(1, 'ON')">BẬT</button>
                    <button class="btn-off" onclick="controlDevice(1, 'OFF')">TẮT</button>
                </div>
                <div class="status-box" id="control-status" style="color: #9bb3c9;">Sẵn sàng</div>
            </div>
        </div>

        <div class="card">
            <div class="title">📊 Dữ liệu cảm biến thời gian thực</div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Thiết bị</th>
                            <th>Điện áp (V)</th>
                            <th>Dòng điện (A)</th>
                            <th>Công suất (W)</th>
                            <th>Năng lượng (kWh)</th>
                            <th>Thời gian</th>
                        </tr>
                    </thead>
                    <tbody id="data-table">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // --- CẤU HÌNH SUPABASE ---
        const SUPABASE_URL = 'https://znfxhbrkabxenuzrcogd.supabase.co';
        const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpuZnhoYnJrYWJ4ZW51enJjb2dkIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NTQ0Mjk4NSwiZXhwIjoyMDkxMDE4OTg1fQ.qNtUEq0HebqEs6tHrWT6Ghj94-UOb5dshIWAvWB8r6Y';

        const supa = supabase.createClient(SUPABASE_URL, ANON_KEY);
        const tableBody = document.getElementById("data-table");
        const statusDiv = document.getElementById("status");
        const controlStatusDiv = document.getElementById("control-status");

        // --- XỬ LÝ DỮ LIỆU ---

        function addRow(log, isNew = false) {
            const limit = parseInt(document.getElementById("limit").value) || 50;
            const row = tableBody.insertRow(0);
            if (isNew) row.classList.add("new-row");

            row.innerHTML = `
                <td>#${log.id}</td>
                <td><span class="badge">DEV ${log.device_id}</span></td>
                <td>${log.voltage ? log.voltage.toFixed(1) : '0.0'}</td>
                <td>${log.current ? log.current.toFixed(2) : '0.00'}</td>
                <td>${log.power ? log.power.toFixed(1) : '0.0'}</td>
                <td>${log.energy ? log.energy.toFixed(2) : '0.00'}</td>
                <td>${new Date(log.created_at).toLocaleTimeString()}</td>
            `;

            if (tableBody.rows.length > limit) {
                tableBody.deleteRow(tableBody.rows.length - 1);
            }
        }

        async function loadInitialData() {
            const limit = parseInt(document.getElementById("limit").value) || 50;
            statusDiv.innerHTML = "🔄 Đang tải...";

            const { data, error } = await supa
                .from('sensor_data')
                .select('*')
                .order('id', { ascending: false })
                .limit(limit);

            if (error) {
                statusDiv.innerHTML = "❌ Lỗi kết nối DB";
                return;
            }

            tableBody.innerHTML = "";
            [...data].reverse().forEach(log => addRow(log, false));
            statusDiv.innerHTML = "🟢 Hệ thống OK";
        }

        function startRealtime() {
            supa.channel('any')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'sensor_data' }, payload => {
                    addRow(payload.new, true);
                }).subscribe();
        }

        // --- XỬ LÝ ĐIỀU KHIỂN ---

        async function controlDevice(deviceId, status) {
            const apiBase = document.getElementById("api").value;
            controlStatusDiv.innerHTML = `⏳ Gửi lệnh ${status}...`;
            controlStatusDiv.style.color = "#f1c40f";

            try {
                // Gọi tới API Spring Boot
                const response = await fetch(`${apiBase}/api/device/control?deviceId=${deviceId}&status=${status}`);

                if (response.ok) {
                    const result = await response.json();
                    controlStatusDiv.innerHTML = `✅ ${status} THÀNH CÔNG`;
                    controlStatusDiv.style.color = "#2ecc71";
                } else {
                    controlStatusDiv.innerHTML = `❌ Lỗi API (${response.status})`;
                    controlStatusDiv.style.color = "#e74c3c";
                }
            } catch (error) {
                controlStatusDiv.innerHTML = "❌ Không tìm thấy Backend";
                controlStatusDiv.style.color = "#e74c3c";
            }

            // Reset text sau 2 giây
            setTimeout(() => {
                controlStatusDiv.innerHTML = "Sẵn sàng";
                controlStatusDiv.style.color = "#9bb3c9";
            }, 2000);
        }

        function manualCheck() { loadInitialData(); }

        // --- KHỞI CHẠY ---
        async function init() {
            await loadInitialData();
            startRealtime();
        }

        init();
    </script>
</body>

</html>
