<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Giám sát & Điều khiển Năng lượng</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* ===== GIỮ NGUYÊN CSS CỦA BẠN ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0b1c2c;
            color: #e6f1ff;
        }

        .wrapper {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: #0f2235;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.05);
            margin-bottom: 25px;
        }

        .title {
            font-size: 18px;
            margin-bottom: 15px;
            color: #00e5ff;
            font-weight: bold;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            padding-bottom: 10px;
        }

        label {
            display: block;
            margin-top: 10px;
            font-size: 13px;
            color: #9bb3c9;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            border: none;
            background: #08131f;
            color: white;
            font-size: 14px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-primary {
            background: #00e5ff;
            color: #000;
        }

        .btn-on {
            background: #2ecc71;
            color: #fff;
        }

        .btn-off {
            background: #e74c3c;
            color: #fff;
        }

        button:hover {
            opacity: 0.8;
            transform: translateY(-1px);
        }

        .status-box {
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            background: #08131f;
            text-align: center;
            font-size: 13px;
        }

        .table-wrapper {
            max-height: 400px;
            overflow-y: auto;
            border-radius: 10px;
            margin-top: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            position: sticky;
            top: 0;
            background: #162d42;
            z-index: 10;
        }

        th,
        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid rgba(0, 255, 255, 0.05);
        }

        th {
            color: #00e5ff;
            font-size: 12px;
        }

        .new-row {
            animation: flash 2s ease-out;
        }

        @keyframes flash {
            0% {
                background: rgba(0, 255, 255, 0.2);
            }

            100% {
                background: transparent;
            }
        }

        /* Layout mới cho header cấu hình */
        .config-bar {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 20px;
            align-items: flex-end;
        }
    </style>
</head>

<body>

    <div class="wrapper">
        <div class="card">
            <div class="title">⚙️ Cấu hình hệ thống & Trạng thái</div>
            <div class="config-bar">
                <div>
                    <label>Địa chỉ API Backend</label>
                    <input id="api" value="http://localhost:8080">
                </div>
                <div>
                    <label>Số dòng hiển thị/bảng</label>
                    <input id="limit" value="10" type="number">
                </div>
                <button class="btn-primary" onclick="manualCheck()">⚡ Làm mới danh sách</button>
            </div>
            <div class="status-box" id="status">🔄 Đang kiểm tra kết nối...</div>
        </div>

        <div id="device-dashboard">
            <div class="status-box">Đang tải danh sách thiết bị từ Database...</div>
        </div>
    </div>

    <script>
        // --- CẤU HÌNH SUPABASE ---
        const SUPABASE_URL = 'https://znfxhbrkabxenuzrcogd.supabase.co';
        const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpuZnhoYnJrYWJ4ZW51enJjb2dkIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NTQ0Mjk4NSwiZXhwIjoyMDkxMDE4OTg1fQ.qNtUEq0HebqEs6tHrWT6Ghj94-UOb5dshIWAvWB8r6Y';

        const supa = supabase.createClient(SUPABASE_URL, ANON_KEY);
        const statusDiv = document.getElementById("status");
        const dashboard = document.getElementById("device-dashboard");

        // --- HÀM KHỞI TẠO BẢNG RIÊNG CHO MỖI THIẾT BỊ ---
        async function initDashboard() {
            const apiBase = document.getElementById("api").value;

            try {
                // 1. Lấy danh sách thiết bị
                const response = await fetch(`${apiBase}/api/devices`);
                const devices = await response.json();

                if (devices.length === 0) {
                    dashboard.innerHTML = '<div class="status-box">⚠️ Không tìm thấy thiết bị nào trong Database.</div>';
                    return;
                }

                dashboard.innerHTML = ""; // Xóa thông báo cũ

                // 2. Tạo Card cho từng thiết bị
                devices.forEach(device => {
                    const id = device.id;
                    const name = device.name || `Thiết bị ${id}`;

                    const deviceCard = document.createElement("div");
                    deviceCard.className = "card";
                    deviceCard.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #00e5ff33; padding-bottom: 10px;">
                            <div style="font-size: 18px; font-weight: bold; color: #00e5ff;">🖥️ ${name} (ID: ${id})</div>
                            <div class="btn-group" style="width: 250px;">
                                <button class="btn-on" onclick="controlDevice(${id}, 'ON')">BẬT</button>
                                <button class="btn-off" onclick="controlDevice(${id}, 'OFF')">TẮT</button>
                            </div>
                        </div>
                        <div id="ctrl-status-${id}" class="status-box" style="font-size: 11px; margin-top: 10px; color: #9bb3c9;">Trạng thái: Sẵn sàng</div>
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Mã tin</th>
                                        <th>Điện áp (V)</th>
                                        <th>Dòng điện (A)</th>
                                        <th>Công suất (W)</th>
                                        <th>Năng lượng (kWh)</th>
                                        <th>Thời gian</th>
                                    </tr>
                                </thead>
                                <tbody id="table-body-${id}">
                                    <tr><td colspan="6">Đang tải dữ liệu...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    `;
                    dashboard.appendChild(deviceCard);

                    // Tải dữ liệu cũ cho từng bảng
                    loadInitialDataForDevice(id);
                });

                statusDiv.innerHTML = "🟢 Kết nối Backend thành công";
                statusDiv.style.color = "#2ecc71";

            } catch (error) {
                statusDiv.innerHTML = "❌ Lỗi: Không kết nối được Backend (Cổng 8080)";
                statusDiv.style.color = "#e74c3c";
            }
        }

        // --- TẢI DỮ LIỆU BAN ĐẦU THEO DEVICE ID ---
        async function loadInitialDataForDevice(deviceId) {
            const limit = parseInt(document.getElementById("limit").value) || 10;
            const tableBody = document.getElementById(`table-body-${deviceId}`);

            const { data, error } = await supa
                .from('sensor_data')
                .select('*')
                .eq('device_id', deviceId)
                .order('id', { ascending: false })
                .limit(limit);

            if (error) return;

            tableBody.innerHTML = "";
            [...data].reverse().forEach(log => renderRow(deviceId, log, false));
        }

        // --- VẼ DÒNG DỮ LIỆU ---
        function renderRow(deviceId, log, isNew = false) {
            const tableBody = document.getElementById(`table-body-${deviceId}`);
            if (!tableBody) return;

            const limit = parseInt(document.getElementById("limit").value) || 10;
            const row = tableBody.insertRow(0);
            if (isNew) row.classList.add("new-row");

            row.innerHTML = `
                <td>#${log.id}</td>
                <td>${log.voltage ? log.voltage.toFixed(1) : '0.0'}</td>
                <td>${log.current ? log.current.toFixed(2) : '0.00'}</td>
                <td>${log.power ? log.power.toFixed(1) : '0.0'}</td>
                <td>${log.energy ? log.energy.toFixed(2) : '0.00'}</td>
                <td>${new Date(log.created_at).toLocaleTimeString()}</td>
            `;

            if (tableBody.rows.length > limit) tableBody.deleteRow(tableBody.rows.length - 1);
        }

        // --- REALTIME CHUYÊN BIỆT ---
        function startRealtime() {
            supa.channel('any').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'sensor_data' },
                payload => {
                    const newLog = payload.new;
                    // Tự động tìm bảng có ID tương ứng để đẩy dữ liệu vào
                    renderRow(newLog.device_id, newLog, true);
                }).subscribe();
        }

        // --- ĐIỀU KHIỂN ---
        async function controlDevice(deviceId, status) {
            const apiBase = document.getElementById("api").value;
            const statusLabel = document.getElementById(`ctrl-status-${deviceId}`);

            statusLabel.innerHTML = `⏳ Đang gửi lệnh ${status}...`;
            statusLabel.style.color = "#f1c40f";

            try {
                const response = await fetch(`${apiBase}/api/device/control?deviceId=${deviceId}&status=${status}`);
                if (response.ok) {
                    statusLabel.innerHTML = `✅ Đã BẬT/TẮT thành công`;
                    statusLabel.style.color = "#2ecc71";
                } else {
                    statusLabel.innerHTML = `❌ Lỗi lệnh (${response.status})`;
                    statusLabel.style.color = "#e74c3c";
                }
            } catch (error) {
                statusLabel.innerHTML = "❌ Backend không phản hồi";
                statusLabel.style.color = "#e74c3c";
            }

            setTimeout(() => {
                statusLabel.innerHTML = "Trạng thái: Sẵn sàng";
                statusLabel.style.color = "#9bb3c9";
            }, 3000);
        }

        function manualCheck() { initDashboard(); }

        // Khởi động
        initDashboard();
        startRealtime();

    </script>
</body>

</html>
