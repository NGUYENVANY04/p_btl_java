<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hệ Thống Giám Sát Năng Lượng - Usercase 4</title>
        <script
            src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { color: #1a73e8; text-align: center; margin-bottom: 25px; text-transform: uppercase; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 12px 20px; background: #e8f0fe; border-radius: 8px; border: 1px solid #c2d7fa; }
        .status-dot { height: 10px; width: 10px; background-color: #34a853; border-radius: 50%; display: inline-block; margin-right: 5px; }
        #connection-status { font-weight: 500; color: #1967d2; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 15px; text-align: center; border-bottom: 1px solid #eee; }
        th { background-color: #1a73e8; color: white; font-weight: 600; font-size: 13px; }
        tr:hover { background-color: #f8f9fa; transition: 0.3s; }
        .new-row { animation: highlight-fade 3s ease-out; }
        @keyframes highlight-fade { 0% { background-color: #d4edda; } 100% { background-color: transparent; } }
        .badge { padding: 5px 12px; border-radius: 20px; background: #34a853; color: white; font-size: 11px; font-weight: bold; }
    </style>
    </head>
    <body>

        <div class="container">
            <h2>Dữ Liệu Cảm Biến Real-Time</h2>
            <div class="status-bar">
                <span>Bảng: <strong>sensor_data</strong></span>
                <span id="connection-status">
                    <span class="status-dot"></span> Đang khởi tạo...
                </span>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Thiết Bị</th>
                        <th>Điện Áp (V)</th>
                        <th>Dòng Điện (A)</th>
                        <th>Công Suất (W)</th>
                        <th>Năng Lượng (Wh)</th>
                        <th>Thời Gian</th>
                    </tr>
                </thead>
                <tbody id="data-table"></tbody>
            </table>
        </div>

        <script>
    const SUPABASE_URL = 'https://znfxhbrkabxenuzrcogd.supabase.co';
    const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpuZnhoYnJrYWJ4ZW51enJjb2dkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0NDI5ODUsImV4cCI6MjA5MTAxODk4NX0.oi6EOu7_IhJeC0jo9ACUIZaQKfsC3tupUVpF9w0DQiQ';

    const _supabase = supabase.createClient(SUPABASE_URL, ANON_KEY);
    const tableBody = document.getElementById('data-table');
    const statusDiv = document.getElementById('connection-status');

    // Hàm tạo dòng dữ liệu
    function addRow(log, isNew = false) {
        const row = tableBody.insertRow(0); 
        if (isNew) row.classList.add('new-row');
        row.innerHTML = `
            <td>#${log.id}</td>
            <td><span class="badge">DEVICE ${log.device_id}</span></td>
            <td><b>${log.voltage?.toFixed(1) || '0.0'}</b> V</td>
            <td><b>${log.current?.toFixed(2) || '0.00'}</b> A</td>
            <td><b>${log.power?.toFixed(1) || '0.0'}</b> W</td>
            <td><b>${log.energy?.toFixed(2) || '0.00'}</b> Wh</td>
            <td style="color: #666;">${new Date(log.created_at).toLocaleTimeString('vi-VN')}</td>
        `;
    }

    // Hàm fetch dữ liệu mới nhất (Refresh)
    async function fetchData() {
        try {
            const { data, error } = await _supabase
                .from('sensor_data')
                .select('*')
                .order('id', { ascending: false })
                .limit(10);

            if (error) throw error;

            // Cập nhật giao diện mà không làm mất hiệu ứng dòng mới nếu có
            const currentIds = Array.from(tableBody.querySelectorAll('td:first-child')).map(td => td.innerText.replace('#', ''));
            
            data.reverse().forEach(item => {
                if (!currentIds.includes(item.id.toString())) {
                    addRow(item, true);
                }
            });

            // Giới hạn số dòng hiển thị cho nhẹ web
            while (tableBody.rows.length > 15) {
                tableBody.deleteRow(tableBody.rows.length - 1);
            }

            statusDiv.innerHTML = '<span class="status-dot"></span> Đang trực tuyến (Sync: 5s)';
        } catch (err) {
            statusDiv.innerHTML = '<span class="status-dot" style="background-color: #ea4335;"></span> Lỗi: ' + err.message;
        }
    }

    // Lắng nghe dữ liệu đẩy từ Server (Real-time)
    function enableRealtime() {
        _supabase
            .channel('db-changes')
            .on('postgres_changes', 
                { event: 'INSERT', schema: 'public', table: 'sensor_data' }, 
                (payload) => {
                    console.log("Dữ liệu mới nhận (Real-time):", payload.new);
                    addRow(payload.new, true);
                }
            )
            .subscribe();
    }

    // Khởi tạo
    fetchData();
    enableRealtime();

    // Tự động đồng bộ mỗi 5 giây để phòng trường hợp Real-time bị đứt kết nối
    setInterval(fetchData, 5000);

</script>
    </body>
</html>
