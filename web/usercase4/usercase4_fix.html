<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Dashboard - User Case 4</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="style4_fix.css">
</head>

<body>
    <div class="wrapper">
        <header class="main-header">
            <h2 style="color: #00e5ff;">🖥️ Giám sát & Điều khiển Realtime</h2>

            <div class="header-controls">
                <input type="hidden" id="api-backend-url" value="http://localhost:8080">
                <input type="hidden" id="row-limit" value="10">
                <button class="btn-refresh" onclick="refreshAll()">🔄 Làm mới danh sách</button>

                <!-- Trạng thái -->
                <div id="conn-status" class="status-tag">🟡 Đang kết nối...</div>
            </div>
        </header>

        <div id="dashboard-container"></div>
    </div>

    <script src="user4_fix.js"></script>
</body>

</html>
