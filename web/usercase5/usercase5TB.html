<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>System Alerts - Fusion Smart</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="usercase5TB.css">
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </head>
    <body class="p-4 md:p-8 flex justify-center items-start min-h-screen">

        <div class="max-w-4xl w-full">
            <header
                class="flex justify-between items-center mb-8 border-b border-white/10 pb-6">
                <div>
                    <h1
                        class="text-2xl font-bold tracking-tight uppercase">Thông
                        báo hệ thống</h1>
                    <p id="alert-count"
                        class="text-slate-400 text-xs font-semibold uppercase tracking-widest mt-1">Đang
                        tải thông báo...</p>
                </div>
                <button onclick="fetchAlerts()" class="refresh-btn">
                    <i class="fas fa-sync-alt"></i> Làm mới
                </button>
            </header>

            <div id="alert-list" class="space-y-4">
                <div class="loading-state">Đang kết nối đến máy chủ...</div>
            </div>
        </div>

        <script src="usercase5TB.js"></script>
    </body>
</html>
