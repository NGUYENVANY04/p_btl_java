<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hệ Thống Giám Sát Điện Năng Pro</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@2.2.1"></script>
        <link rel="stylesheet" href="usercase5TT.css">
    </head>
    <body class="p-4 md:p-8 flex justify-center items-center min-h-screen">
        <div class="max-w-6xl w-full">
            <header
                class="flex justify-between items-end mb-8 border-b border-white/10 pb-6">
                <div>
                    <h1
                        class="text-2xl font-bold tracking-tight uppercase text-white">Quản
                        lý năng lượng</h1>
                    <p
                        class="text-emerald-400 text-xs font-semibold uppercase tracking-widest mt-1 italic">Hệ
                        thống giám sát v2.0</p>
                </div>
                <div class="text-right">
                    <div id="full-date"
                        class="text-xl font-light text-slate-300">-- : -- :
                        --</div>
                    <div id="calendar-date"
                        class="text-[10px] uppercase tracking-wider text-slate-500 font-bold mt-1">--</div>
                </div>
            </header>

            <div class="flex flex-wrap items-center justify-between gap-4 mb-8">
                <div
                    class="flex gap-2 bg-white/5 p-1 rounded-full border border-white/5">
                    <button onclick="switchTab('today', this)"
                        class="tab-btn active">Ngày</button>
                    <button onclick="switchTab('month', this)"
                        class="tab-btn">Tháng</button>
                    <button onclick="switchTab('year', this)"
                        class="tab-btn">Năm</button>
                    <button onclick="switchTab('overview', this)"
                        class="tab-btn">Tổng quan</button>
                </div>

                <div id="history-selector"
                    class="flex flex-wrap items-center gap-3">
                    <div
                        class="flex items-center gap-2 bg-white/5 px-3 py-1 rounded-full border border-white/10">
                        <span
                            class="text-[10px] text-slate-400 uppercase font-bold tracking-widest">Thời
                            gian:</span>
                        <input type="date" id="main-day"
                            onchange="fetchAndRenderData()"
                            class="input-style-mini">
                        <input type="month" id="main-month"
                            onchange="fetchAndRenderData()"
                            class="input-style-mini hidden">
                        <input type="number" id="main-year" value="2026"
                            onchange="fetchAndRenderData()"
                            class="input-style-mini hidden w-20">
                    </div>

                    <div id="compare-section"
                        class="flex items-center gap-2 bg-amber-500/5 px-3 py-1 rounded-full border border-amber-500/20">
                        <input type="checkbox" id="compare-enable"
                            onchange="fetchAndRenderData()"
                            class="cursor-pointer accent-amber-500">
                        <span
                            class="text-[10px] text-amber-500 uppercase font-bold tracking-widest">So
                            sánh:</span>
                        <input type="date" id="comp-day"
                            onchange="fetchAndRenderData()"
                            class="input-style-mini text-amber-400">
                        <input type="month" id="comp-month"
                            onchange="fetchAndRenderData()"
                            class="input-style-mini text-amber-400 hidden">
                        <input type="number" id="comp-year" value="2025"
                            onchange="fetchAndRenderData()"
                            class="input-style-mini text-amber-400 hidden w-20">
                    </div>
                </div>
            </div>

            <section class="energy-box rounded-3xl p-8 mb-6 shadow-2xl">
                <div class="flex flex-wrap items-center justify-between gap-8">
                    <div class="flex-1">
                        <h3 id="energy-title"
                            class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-2 italic">Đang
                            tải dữ liệu...</h3>
                        <div class="flex items-baseline gap-4">
                            <span id="energy-main"
                                class="text-6xl md:text-8xl font-light tracking-tighter text-white leading-none">0.00</span>
                            <span
                                class="text-2xl font-bold text-slate-500 italic">kWh</span>
                        </div>
                    </div>
                    <div class="text-right border-l border-white/10 pl-8">
                        <p
                            class="text-[10px] text-slate-500 uppercase font-bold mb-1 tracking-widest">Thành
                            tiền dự kiến</p>
                        <div id="money-display"
                            class="text-3xl md:text-5xl font-bold text-emerald-400">0
                            VNĐ</div>
                    </div>
                </div>
            </section>

            <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
                <section
                    class="energy-box rounded-3xl p-6 shadow-xl lg:col-span-3">
                    <div class="chart-container"
                        style="height: 400px; position: relative;">
                        <canvas id="energyChart"></canvas>
                    </div>
                </section>

                <aside
                    class="energy-box rounded-3xl p-6 shadow-xl flex flex-col justify-between">
                    <div class="space-y-6">
                        <h4
                            class="text-[10px] text-slate-400 uppercase font-bold border-b border-white/10 pb-2">Cấu
                            hình hệ thống</h4>
                        <div class="space-y-1">
                            <label
                                class="text-[10px] text-slate-400 uppercase">Giá
                                điện (đ/kWh)</label>
                            <input type="number" id="elec-price" value="3000"
                                oninput="updateMetricsOnly()"
                                class="w-full bg-slate-800 border border-white/10 rounded-lg px-3 py-2 text-right text-sm text-white focus:border-emerald-500 outline-none">
                        </div>
                        <div class="space-y-1">
                            <label
                                class="text-[10px] text-orange-400 uppercase font-bold">Vạch
                                đỏ cảnh báo (kWh)</label>
                            <input type="number" id="chart-threshold" value="10"
                                oninput="updateChartLine()"
                                class="w-full bg-slate-800 border border-orange-900/30 rounded-lg px-3 py-2 text-right text-sm text-orange-400 outline-none">
                        </div>
                        <div class="space-y-1">
                            <label
                                class="text-[10px] text-red-500 uppercase font-bold">Mục
                                tiêu tổng (kWh)</label>
                            <input type="number" id="goal-total" value="1000000"
                                oninput="updateMetricsOnly()"
                                class="w-full bg-slate-800 border border-red-900/30 rounded-lg px-3 py-2 text-right text-sm text-red-500 outline-none">
                        </div>
                    </div>
                    <div class="mt-8 pt-6 border-t border-white/10">
                        <div class="flex justify-between items-end mb-2">
                            <span
                                class="text-[10px] text-slate-400 uppercase font-bold tracking-widest">Tiến
                                độ tiêu thụ</span>
                            <span id="percent-label"
                                class="text-emerald-400 font-bold text-lg">0%</span>
                        </div>
                        <div
                            class="w-full bg-slate-900 h-4 rounded-full overflow-hidden p-[2px]">
                            <div id="percent-bar"
                                class="bg-emerald-500 h-full rounded-full transition-all duration-700 shadow-[0_0_10px_rgba(16,185,129,0.3)]"
                                style="width: 0%"></div>
                        </div>
                    </div>
                </aside>
            </div>
        </div>
        <script src="usercase5TT.js"></script>
    </body>
</html>
