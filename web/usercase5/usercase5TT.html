<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tổng hợp tiêu thụ năng lượng</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <link rel="stylesheet" href="usercase5TT.css">
    </head>
    <body class="p-4 md:p-8 flex justify-center items-center min-h-screen">

        <div class="max-w-4xl w-full">
            <header
                class="flex justify-between items-end mb-8 border-b border-white/10 pb-6">
                <div>
                    <h1
                        class="text-2xl font-bold tracking-tight uppercase">Tổng
                        hợp tiêu thụ năng lượng</h1>
                    <p
                        class="text-emerald-400 text-xs font-semibold uppercase tracking-widest mt-1 italic">Báo
                        cáo & Phân tích</p>
                </div>
                <div class="text-right">
                    <div id="full-date"
                        class="text-xl font-light text-slate-300">-- : -- :
                        --</div>
                    <div id="calendar-date"
                        class="text-[10px] uppercase tracking-wider text-slate-500 font-bold mt-1">Thứ
                        ---, 00 Tháng 00, 2026</div>
                </div>
            </header>

            <div class="flex flex-wrap items-center justify-between gap-4 mb-8">
                <div
                    class="flex gap-2 bg-white/5 p-1 rounded-full border border-white/5">
                    <button onclick="switchTab('today', this)"
                        class="tab-btn active">Ngày</button>
                    <button onclick="switchTab('month', this)"
                        class="tab-btn">Tháng</button>
                    <button onclick="switchTab('year', this)"
                        class="tab-btn">Năm</button>
                </div>

                <div id="history-selector" class="flex items-center gap-3">
                    <span
                        class="text-xs text-slate-400 uppercase font-bold tracking-widest">Xem
                        lại:</span>
                    <input type="date" id="date-picker"
                        onchange="loadHistoryData()" value="2026-04-09">
                    <select id="year-picker" class="hidden"
                        onchange="loadHistoryData()">
                        <option value="2026">2026</option>
                        <option value="2025">2025</option>
                        <option value="2024">2024</option>
                        <option value="2023">2023</option>
                        <option value="2022">2022</option>
                        <option value="2021">2021</option>
                        <option value="2020">2020</option>
                    </select>
                </div>
            </div>

            <section class="energy-box rounded-3xl p-8 mb-8 shadow-2xl">
                <h3 id="energy-title"
                    class="text-slate-400 text-sm font-bold uppercase tracking-widest mb-4">Tiêu
                    thụ hôm nay</h3>
                <div class="flex items-baseline gap-4">
                    <span id="energy-main"
                        class="text-8xl font-light tracking-tighter text-white">0.00</span>
                    <span
                        class="text-3xl font-bold text-slate-500 italic">Energy</span>
                </div>
            </section>

            <section class="energy-box rounded-3xl p-6 shadow-xl">
                <div class="chart-container">
                    <canvas id="energyChart"></canvas>
                </div>
            </section>
        </div>

        <script src="usercase5TT.js"></script>
    </body>
</html>
