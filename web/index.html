<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Test POST & GET Alert</title>
</head>

<body>
    <h2>Send Alert to Spring Boot</h2>

    <form id="alertForm">
        <label>Device ID: </label>
        <input type="number" id="device_id" value="1" required><br><br>

        <label>Type: </label>
        <input type="text" id="type" value="warning" required><br><br>

        <label>Message: </label>
        <input type="text" id="message" value="Over voltage" required><br><br>

        <label>Is Read: </label>
        <input type="checkbox" id="is_read"><br><br>

        <button type="submit">Send Alert</button>
    </form>

    <h3>Response:</h3>
    <pre id="response"></pre>

    <h2>All Alerts</h2>
    <button id="fetchAlerts">Refresh Alerts</button>
    <pre id="alertsList"></pre>

    <script>
        const form = document.getElementById("alertForm");
        const responseEl = document.getElementById("response");
        const alertsList = document.getElementById("alertsList");
        const fetchAlertsBtn = document.getElementById("fetchAlerts");

        // POST alert
        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const data = {
                device_id: parseInt(document.getElementById("device_id").value),
                type: document.getElementById("type").value,
                message: document.getElementById("message").value,
                is_read: document.getElementById("is_read").checked
            };

            try {
                const res = await fetch("http://localhost:8081/api/alerts", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });

                const json = await res.json();
                responseEl.textContent = JSON.stringify(json, null, 2);

                // Tự động refresh danh sách alert sau khi POST
                fetchAllAlerts();

            } catch (err) {
                responseEl.textContent = "Error: " + err;
            }
        });

        // GET all alerts
        async function fetchAllAlerts() {
            try {
                const res = await fetch("http://localhost:8081/api/alerts");
                const json = await res.json();
                alertsList.textContent = JSON.stringify(json, null, 2);
            } catch (err) {
                alertsList.textContent = "Error: " + err;
            }
        }

        // Nút refresh thủ công
        fetchAlertsBtn.addEventListener("click", fetchAllAlerts);

        // Load alert ngay khi mở trang
        fetchAllAlerts();
    </script>
</body>

</html>
