# Cấu hình SQLServer
# Bạn có thể set biến môi trường để tránh hard-code thông tin DB.
# Mặc định URL dùng localhost.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=backend_iot;encrypt=true;trustServerCertificate=true}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# Cấu hình Hibernate (tự động tạo/cập nhật bảng theo entity)
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update

# Hiện thị các câu lệnh SQL trong console
spring.jpa.show-sql=true