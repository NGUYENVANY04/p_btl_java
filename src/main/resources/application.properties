spring.application.name=demo
server.port=8081

# Local dev datasource (H2). For Supabase Postgres, override these via environment variables
# or switch to your Supabase connection string.
spring.datasource.url=jdbc:h2:mem:iotdemo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Offline detection tuning
iot.device.offlineThresholdSeconds=60
iot.device.offlineCheckMs=60000