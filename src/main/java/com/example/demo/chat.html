<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>CAN Bus Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(to right, #0f172a, #1e293b);
            color: white;
        }

        h1 {
            padding: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: #111827;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.03);
        }

        .status {
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 12px;
        }

        .online {
            background: green;
        }

        .offline {
            background: red;
        }
    </style>
</head>

<body>

    <h1>🚀 CAN Bus Dashboard</h1>

    <div class="grid" id="grid"></div>

    <script>
        function generateNode(id) {
            return {
                id: id,
                water: (Math.random() * 100).toFixed(1),
                tilt: (Math.random() * 45).toFixed(1),
                online: Math.random() > 0.2
            };
        }

        function render() {
            const grid = document.getElementById("grid");
            grid.innerHTML = "";

            for (let i = 1; i <= 5; i++) {
                const node = generateNode(i);

                const div = document.createElement("div");
                div.className = "card";

                div.innerHTML = `
            <h2>Node #${node.id}</h2>
            <span class="status ${node.online ? "online" : "offline"}">
                ${node.online ? "ONLINE" : "OFFLINE"}
            </span>
            <p>💧 Water Level: <b>${node.water}%</b></p>
            <p>📐 Tilt: <b>${node.tilt}°</b></p>
            <p>🔗 Connection: <b>${node.online ? "Stable" : "Lost"}</b></p>
        `;

                grid.appendChild(div);
            }
        }

        // update mỗi 1.5s
        setInterval(render, 1500);
        render();
    </script>

</body>

</html>
